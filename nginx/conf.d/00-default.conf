# Sitio por defecto: atiende cualquier petición cuyo Host no coincida con otro server_name.
# NO necesitas modificar este archivo.
server {
    listen 80 default_server;
    server_name _;
    add_header X-Bloque "default" always;    # pista visible con: curl -v
    root /usr/share/nginx/html/default;
    location / {
        try_files $uri $uri/ =404;
    }
}
