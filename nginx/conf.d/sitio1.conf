# Server block de sitio1.lab.test
# Este archivo contiene una avería. Tu tarea: diagnosticarla y corregirla.
server {
    listen 80;
    server_name sitio1.lab.tset;
    add_header X-Bloque "sitio1" always;
    root /usr/share/nginx/html/sitio1;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
