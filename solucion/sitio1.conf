# SOLUCIÓN DE REFERENCIA. Intenta resolver el laboratorio antes de abrir este archivo.
# Avería: server_name tenía un error tipográfico ("sitio1.lab.tset").
# Como ningún server_name coincidía con el encabezado Host, Nginx usaba el default_server.
server {
    listen 80;
    server_name sitio1.lab.test;
    add_header X-Bloque "sitio1" always;
    root /usr/share/nginx/html/sitio1;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
